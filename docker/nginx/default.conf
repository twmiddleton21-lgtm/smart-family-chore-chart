# Smart Family Chore Chart: static frontend server (FRONTEND-ONLY).
#
# Serves the Vite production build. There is no API behind this server:
# family data lives in each browser's localStorage, so this container does
# NOT share or persist family data between devices. See
# docs/SHARED-DATA-PLAN.md before using it for real family data.
#
# Runs inside nginxinc/nginx-unprivileged (non-root, uid 101) on port 8080.
# TLS is expected to be terminated in front of it (e.g. a tunnel/reverse proxy).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Liveness endpoint for the container HEALTHCHECK.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets, so they can be cached forever.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else (index.html, favicon): always revalidate so a new
    # release is picked up straight away. Unknown paths fall back to the app.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Never serve hidden files (e.g. a stray .env), even if one were copied in.
    location ~ /\. {
        return 404;
    }
}

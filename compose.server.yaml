# Smart Family Chore Chart: SHARED FAMILY SERVER, minimal Compose file.
# Installation: docs/INSTALL-UBUNTU.md. Reference: docs/DOCKER-SERVER.md.
#
# Settings come from a .env file next to this file (copy .env.example) or
# from the environment:
#
#   cp .env.example .env    # then edit it
#   docker pull "$(grep ^SFCC_SERVER_IMAGE= .env | cut -d= -f2)"
#   docker compose -f compose.server.yaml up -d
#
# Deliberately:
#   - the image must be named exactly (SFCC_SERVER_IMAGE, a versioned tag):
#     there is no default and no "latest", and it is never pulled or built
#     here (pull_policy: never). Pull it yourself (docker pull), or load a
#     saved archive (docker load);
#   - the port is published on 127.0.0.1 (this computer only) unless
#     SFCC_BIND_ADDRESS names one specific address, such as this machine's
#     private LAN IP. Don't use 0.0.0.0;
#   - one named volume holds the database and its backups (/data);
#   - no reverse proxy, tunnel or other services.
#
# This file is separate from ./compose.yaml (the published browser-only image).

services:
  app:
    image: ${SFCC_SERVER_IMAGE:?Set SFCC_SERVER_IMAGE to the exact server image (e.g. ghcr.io/twmiddleton21-lgtm/smart-family-chore-chart-server:<version>)}
    pull_policy: never
    restart: unless-stopped
    ports:
      # <address on this machine>:<port on this machine>:<port in the container>
      - "${SFCC_BIND_ADDRESS:-127.0.0.1}:${SFCC_HOST_PORT:-3000}:3000"
    environment:
      # Household time zone (IANA name), used for "today".
      SFCC_TIMEZONE: ${SFCC_TIMEZONE:-UTC}
      # Host names/addresses the server answers to besides localhost,
      # 127.0.0.1 and [::1]. Set it to the address you type in the browser
      # (e.g. the LAN IP in SFCC_BIND_ADDRESS); others get 421.
      SFCC_ALLOWED_HOSTS: ${SFCC_ALLOWED_HOSTS:-}
      # auto: Secure cookies only for HTTPS requests (plain-HTTP testing
      # works). Behind an HTTPS reverse proxy use "always", or list the proxy
      # in SFCC_TRUST_PROXY.
      SFCC_COOKIE_SECURE: ${SFCC_COOKIE_SECURE:-auto}
      # Reverse proxies to trust (IP addresses / CIDR ranges); empty = none.
      SFCC_TRUST_PROXY: ${SFCC_TRUST_PROXY:-}
    volumes:
      - chorechart-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  chorechart-data:
